spring:
  application:
    name: 06-api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
       routes:

        - id: irctc-booking-service
          uri: lb://04-IRCTC-BOOKING
          predicates:
            - Path=/irctc/booking/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

server:
  port: 8085
